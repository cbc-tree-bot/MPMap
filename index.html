<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CBCity Representitive Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

/* Map fills screen */
#map {
    height: 100%;
    width: 100%;
}

/* -----------------------------
   POPUPS (mobile-friendly text)
------------------------------*/
.leaflet-popup-content {
    font-size: 16px;
    line-height: 1.2;
}

@media (max-width: 768px) {

    .leaflet-popup-content {
        font-size: 28px;
		line-height: 1.6;	
    }

}

/* -----------------------------
   LAYER CONTROL (big improvement)
------------------------------*/
.leaflet-control-layers {
    font-size: 16px;
    max-width: 220px;
}


/* MOBILE: make controls larger & usable */
@media (max-width: 768px) {

    .leaflet-control-layers {
        font-size: 28px;
        max-width: 90vw;
    }

    .leaflet-control-layers-toggle {
        transform: scale(2.6);
    }
}

/* -----------------------------
   ZOOM BUTTONS
------------------------------*/
.leaflet-control-zoom a {
    font-size: 18px;
}

/* Bigger tap targets on mobile */
@media (max-width: 768px) {

    .leaflet-control-zoom a {
        font-size: 30px;
        width: 36px;
        height: 36px;
        line-height: 36px;
    }
}

.basemap-filter {
  filter: brightness(1) contrast(1);
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map',{
center:[-33.92889388810718,151.04364403022035],
zoom:12
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    className: 'basemap-filter',
  	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
	subdomains: 'abcd',
	maxZoom: 20
}).addTo(map);


	//L.tileLayer(
	//'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
	//className: 'basemap-filter',
	//attribution:'© OpenStreetMap contributors'
	//}
	//).addTo(map);

map.createPane('lgaPane');
map.getPane('lgaPane').style.zIndex = 250;




// ArcGIS query 
async function queryArcGIS(url){

try{

let response = await fetch(url);

if(!response.ok){
    console.log("ArcGIS error:", response.status, url);
    return null;
}

return await response.json();

}catch(err){

console.log("Fetch failed:", err, url);
return null;

}

}

// MEMBER DATA
// Use PS1 script to create JSON files from CSV files here:
//Download all the Legislative Council from: https://www.parliament.nsw.gov.au/members/downloadables/Pages/Members-of-the-Legislative-Council.aspx
//Download All_members_by_name.csv from: https://www.aph.gov.au/Senators_and_Members/Contacting_Senators_and_Members/Address_labels_and_CSV_files 
//upload json files to location

let nswMembers={};
let federalMembers={};

async function loadMemberData(){

try{


nswMembers=
await (await fetch("nsw-members.json")).json();

federalMembers=
await (await fetch("federal-members.json")).json();

}catch(e){

console.log(
"No member files yet"
);
}
}


// layers
let lgaLayer;
let stateLayer;
let federalLayer;
let selectedLayer = null;

function highlightFeature(layer){

    // Reset previous selected polygon
    if(selectedLayer){

        if(selectedLayer.defaultStyle){
            selectedLayer.setStyle(
                selectedLayer.defaultStyle
            );
        }
    }

    selectedLayer = layer;

    // Highlight style
    layer.setStyle({
		color:"#8A2BE2",
		weight:4,
		fillOpacity:0.4
    });

    // Bring selected polygon to front
    if(!L.Browser.ie &&
       !L.Browser.opera &&
       !L.Browser.edge){

        layer.bringToFront();
    }

}


// CBCity outline
async function loadLGA(){

let url =
"https://portal.spatial.nsw.gov.au/server/rest/services/NSW_Administrative_Boundaries_Theme_multiCRS/FeatureServer/8/query?f=geojson&outFields=*&where=councilname='CANTERBURY-BANKSTOWN COUNCIL'";

let data = await queryArcGIS(url);

if(!data){
    console.log("LGA failed to load");
    return;
}

lgaLayer = L.geoJSON(data, {

    pane: 'lgaPane',

    style: {
        color: "#555555",
        weight: 6,
        //fillColor: "#55555",
        fillOpacity: 0.0
    }

});

lgaLayer.addTo(map);
}



// State districts
async function loadState(){

let data =
await queryArcGIS(
"https://portal.spatial.nsw.gov.au/server/rest/services/NSW_Administrative_Boundaries_Theme_multiCRS/FeatureServer/4/query?f=geojson&outFields=*&geometry=151.04364403022035,-33.92889388810718&geometryType=esriGeometryPoint&spatialRel=esriSpatialRelIntersects&distance=30000&units=esriSRUnit_Meter"
);

stateLayer=L.geoJSON(data,{

style:{
color:"#0b5fff",
weight:2.5,
fillColor:"#5b8cff",
fillOpacity:0.05,
dashArray: '5, 7'
},

onEachFeature:function(feature,layer){

    // Save original style
    layer.defaultStyle={
        color:"#0b5fff",
        weight:2.5,
        fillColor:"#5b8cff",
        fillOpacity:0.05,
		dashArray: '5, 7'
    };

    layer.on("click",function(){

        highlightFeature(layer);

    });

let district=
feature.properties.districtname
||feature.properties.NAME;

let member=
nswMembers[
    district.trim().toUpperCase()
];

let html=
`
<b>NSW District:</b>
${district}<br>
`;

if(member){

    html += `
    <hr>

    <b>Representative:</b>
    ${member.name || 'Unknown'}<br>

    <b>Party:</b>
    ${member.party || 'Unknown'}<br>

    ${member.ministerialTitle ?
    `<b>Ministerial title:</b>
    ${member.ministerialTitle}<br>` : ''}

    ${member.phone ?
    `<b>Phone:</b>
    ${member.phone}<br>` : ''}

    ${member.email ?
    `<b>Email:</b>
    ${member.email}
    </a><br>` : ''}
    `;
}

layer.bindPopup(html);

}

});

stateLayer.addTo(map);

}


// Federal electorates

async function loadFederal(){

let data =
await queryArcGIS(
"https://portal.spatial.nsw.gov.au/server/rest/services/NSW_Administrative_Boundaries_Theme_multiCRS/FeatureServer/9/query?f=geojson&outFields=*&geometry=151.04364403022035,-33.92889388810718&geometryType=esriGeometryPoint&spatialRel=esriSpatialRelIntersects&distance=30000&units=esriSRUnit_Meter"
);

federalLayer=L.geoJSON(data,{

style:{
color:"#cc0000",
weight:2.5,
fillColor:"#ff7777",
fillOpacity:0.05,
dashArray: '5, 7'
},

onEachFeature:function(feature,layer){

    // Save original style
    layer.defaultStyle={
        color:"#cc0000",
        weight:2.5,
        fillColor:"#ff7777",
        fillOpacity:0.05,
		dashArray: '5, 7'
    };

    layer.on("click",function(){

        highlightFeature(layer);

    });

let electorate=
feature.properties.elect_div
||feature.properties.divisionname;

let member=
federalMembers[
    electorate.trim().toUpperCase()
];



let html=
`
<b>Federal Electorate:</b>
${electorate}<br>
`;

if(member){


    html += `
    <hr>

    <b>Representative:</b>
    ${member.name || 'Unknown'}<br>

    <b>Party:</b>
    ${member.party || 'Unknown'}<br>

    ${member.ministerialTitle ?
    `<b>Ministerial title:</b>
    ${member.ministerialTitle}<br>` : ''}

    ${member.phone ?
    `<b>Phone:</b>
    ${member.phone}<br>` : ''}
	
	${member.email ?
    `<b>Email:</b>
    ${member.email}<br>` : ''}

    ${member.state ?
    `<b>State:</b>
    ${member.state}<br>` : ''}
    `;
}

layer.bindPopup(html);

}

});

federalLayer.addTo(map);

}

// init
(async () => {

	await loadMemberData();
    await Promise.all([
        loadLGA(),
        loadState(),
        loadFederal()
    ]);

	L.control.layers(null,{
            "NSW State Districts": stateLayer,
            "Federal Electorates": federalLayer
        }, {
    collapsed: false,
    position: 'topright'
}).addTo(map);

})();

</script>

</body>
</html>
